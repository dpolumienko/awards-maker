# Put in /etc/nginx/sites-available and symlink. TLS is left to certbot, which
# rewrites the server block it manages.

server {
    listen 80;
    server_name awards.streamscharts.com;

    client_max_body_size 8m;   # covers and nominee images go through here

    # Resolving the upstream through a variable means nginx starts even when the
    # app container is down. With a literal proxy_pass hostname it refuses to
    # load the config at all, so one dead container takes the whole box's nginx
    # with it.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $upstream_awards awards-maker;
        proxy_pass http://$upstream_awards:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # server/utils/same-origin.ts reads this to compare against the public
        # host rather than the container name
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection '';
        proxy_read_timeout 60;
        proxy_connect_timeout 10;
        proxy_send_timeout 60;
        # Nitro streams the SSR response; buffering it adds latency for no gain.
        proxy_buffering off;
    }
}
